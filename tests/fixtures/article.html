<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>SnFont content-engine fixture</title>
    <style>
      .custom-brand-type {
        font-family: Georgia, serif;
      }
    </style>
  </head>
  <body>
    <main>
      <article>
        <h1 id="default-heading">عنوان عربي بخط المتصفح الافتراضي</h1>
        <p id="default-copy">هذا نص عربي افتراضي ومعه English words لاختبار الفصل الذكي بين المحارف.</p>
        <p id="custom-copy" class="custom-brand-type">هذا النص يملك خطًا صرّح به الموقع ويجب حمايته.</p>
        <button id="interactive-control"><span>لا تعدّل نص الزر</span></button>
        <label>حقل كتابة <input id="editable-control" value="لا تعدّلني"></label>
      </article>
    </main>
    <script>
      window.setTimeout(() => {
        const paragraph = document.createElement('p')
        paragraph.id = 'dynamic-copy'
        paragraph.textContent = 'نص ديناميكي ظهر بعد تحميل الصفحة.'
        document.querySelector('article').append(paragraph)
      }, 80)
    </script>
  </body>
</html>
