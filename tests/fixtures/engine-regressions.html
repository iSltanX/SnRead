<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>SnRead engine regression harness</title>
    <style>
      body { font-family: Arial, sans-serif; }
      .authored { font-family: Georgia, serif; }
    </style>
  </head>
  <body>
    <!--
      Drives the 1.2 page-engine fixes in a real browser (the project has no DOM
      dependency, so these cannot run under node:test). Serve the repository with
      `npm run harness` and open this file; the three checks below are driven by
      hand from the console, and by the Playwright suite in tests/playwright.

        1. a class toggle on <body> must not unmark and rescan the whole page
        2. a wholesale style-attribute rewrite must restore the per-element size
        3. a burst of storage writes must coalesce into one re-apply
    -->
    <main>
      <article id="article">
        <h1 id="heading">عنوان عربي بخط المتصفح الافتراضي</h1>
        <p id="copy-a">فقرة عربية أولى ومعها English words لاختبار الفصل الذكي بين المحارف داخل السطر.</p>
        <p id="copy-b">فقرة ثانية طويلة بما يكفي لتُعامل كنص أساسي في محرك القراءة الآمن.</p>
        <p id="copy-c" class="authored">فقرة يملك الموقع خطها ويجب ألا تُمس.</p>
        <p id="animated">فقرة تعيد مكتبة حركة كتابة سمة style كاملة عليها.</p>
      </article>
    </main>

    <script>
      // Minimal extension-API mock; production code still runs unchanged.
      const listeners = { message: [], storage: [] }
      let applyCount = 0
      window.__snreadApplyCount = () => applyCount
      window.chrome = {
        runtime: {
          id: 'snread-engine-harness',
          getURL(path) { return new URL(`../../${path}`, location.href).href },
          async sendMessage() {
            applyCount += 1
            return {
              ok: true,
              excluded: false,
              effectiveSettings: {
                enabled: true,
                mode: 'design',
                arabicFont: 'Noto Sans Arabic',
                englishFont: 'Inter',
                fontSizePreset: 'normal',
                fontSize: 16,
                lineHeight: 1.5,
                letterSpacing: 0,
                textWidth: 100,
                reduceVisualNoise: false,
              },
            }
          },
          onMessage: { addListener(fn) { listeners.message.push(fn) } },
        },
        storage: {
          local: { async get() { return {} } },
          onChanged: {
            addListener(fn) { listeners.storage.push(fn) },
            emit(changes) { for (const fn of listeners.storage) fn(changes, 'local') },
          },
        },
      }
    </script>
    <script src="../../src/content/content.js"></script>
  </body>
</html>
